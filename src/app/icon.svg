<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0B1220"/>
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F5941F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5941F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="url(#glow)"/>
    <!-- rising light -->
    <circle cx="16" cy="14.5" r="6.4" fill="#F5941F"/>
    <!-- horizon -->
    <rect x="0" y="20" width="32" height="1.5" fill="#F3F5F8" opacity="0.85"/>
    <!-- reflection on the water -->
    <rect x="15" y="22.5" width="2" height="6.5" fill="#F5941F" opacity="0.75"/>
    <rect x="11" y="23.5" width="1.2" height="4.5" fill="#F5941F" opacity="0.4"/>
    <rect x="20" y="23.5" width="1.2" height="4.5" fill="#F5941F" opacity="0.4"/>
  </g>
</svg>
